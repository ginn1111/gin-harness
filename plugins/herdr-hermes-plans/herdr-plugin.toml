id = "gin.hermes-plans"
name = "Hermes Plans"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Pick a workspace Hermes plan and send it to the invoking agent"
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Hermes: send plan to agent"
contexts = ["pane"]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/picker.py\" open"]

[[panes]]
id = "picker"
title = "Hermes Plans"
placement = "popup"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/picker.py\" pick"]
